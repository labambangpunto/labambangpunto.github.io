<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preview PDF dengan Tombol Kembali</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background-color: #525659;
        font-family: Arial, sans-serif;
        overflow: hidden;
      }

      .pdf-container {
        width: 100%;
        height: 100vh;
        display: block;
      }

      .pdf-viewer {
        width: 100%;
        height: 100%;
        border: none;
      }

      .fallback-message {
        color: #ffffff;
        text-align: center;
        padding: 50px 20px;
        line-height: 1.6;
        background-color: #333333;
        height: 100%;
        box-sizing: border-box;
      }

      .fallback-message h2 {
        margin-top: 0;
      }

      .fallback-message a {
        color: #4caf50;
        text-decoration: none;
        font-weight: bold;
        padding: 10px 15px;
        border: 1px solid #4caf50;
        border-radius: 5px;
        display: inline-block;
        margin-top: 15px;
        background-color: rgba(76, 175, 80, 0.1);
      }

      .fallback-message a:hover {
        background-color: #4caf50;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="pdf-container">
      <object class="pdf-viewer" data="pept.pdf" type="application/pdf">
        <div class="fallback-message">
          <h2>Browser Tidak Mendukung Preview PDF</h2>
          <p>
            Browser versi lama Anda tidak memiliki plugin bawaan untuk
            menampilkan PDF di halaman web.
          </p>
          <a href="pept.pdf" target="_blank" rel="noopener noreferrer">
            Unduh File PDF Secara Langsung
          </a>
        </div>
      </object>
    </div>
  </body>
</html>
